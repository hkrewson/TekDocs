openapi: 3.0.3
info:
  title: TekDocs API
  version: 0.1.4
  description: Self-hosted MSP knowledge and inventory API
paths:
  /api/v1/:
    get:
      operationId: root_retrieve
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/context:
    get:
      operationId: auth_context_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedContext'
          description: ''
        '403':
          description: Authentication or installation membership required
        '503':
          description: Installation context unavailable
  /api/v1/auth/profile:
    patch:
      operationId: auth_profile_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedContext'
          description: ''
        '400':
          description: Invalid profile details
        '403':
          description: Authentication or installation membership required
  /api/v1/auth/providers:
    get:
      operationId: auth_providers_retrieve
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcProviderList'
          description: ''
  /api/v1/bootstrap/owner:
    post:
      operationId: bootstrap_owner_create
      parameters:
      - in: header
        name: X-TekDocs-Bootstrap-Token
        schema:
          type: string
        description: High-entropy deployment bootstrap secret
        required: true
      tags:
      - bootstrap
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerBootstrap'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OwnerBootstrap'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OwnerBootstrap'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerBootstrapResult'
          description: ''
        '400':
          description: Invalid bootstrap details
        '403':
          description: Bootstrap authorization failed
        '409':
          description: Installation already bootstrapped or not pristine
  /api/v1/bootstrap/status:
    get:
      operationId: bootstrap_status_retrieve
      tags:
      - bootstrap
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapStatus'
          description: ''
  /api/v1/health/live:
    get:
      operationId: health_live_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/health/ready:
    get:
      operationId: health_ready_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/invitations:
    get:
      operationId: invitations_list
      tags:
      - invitations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
          description: ''
        '403':
          description: Owner required
    post:
      operationId: invitations_create
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
        '400':
          description: Invalid invitation details
        '403':
          description: Owner required
        '409':
          description: Invitation conflict
        '503':
          description: Invitation retained but email delivery failed
  /api/v1/invitations/{invitation_id}/resend:
    post:
      operationId: invitations_resend_create
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - invitations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
        '403':
          description: Owner required
        '404':
          description: Invitation not found
        '409':
          description: Invitation is not pending
        '503':
          description: Invitation retained but email delivery failed
  /api/v1/invitations/{invitation_id}/revoke:
    post:
      operationId: invitations_revoke_create
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - invitations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
        '403':
          description: Owner required
        '404':
          description: Invitation not found
        '409':
          description: Invitation is not pending
  /api/v1/invitations/accept:
    post:
      operationId: invitations_accept_create
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedContext'
          description: ''
        '400':
          description: Invalid account details or password
        '403':
          description: CSRF validation failed
        '409':
          description: Sign out before accepting an invitation
        '410':
          description: Invitation unavailable
  /api/v1/organizations:
    get:
      operationId: organizations_list
      tags:
      - organizations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
          description: ''
        '403':
          description: Installation owner with MFA required
    post:
      operationId: organizations_create
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
        '400':
          description: Invalid organization details
        '403':
          description: Installation owner with MFA required
  /api/v1/organizations/{entity_id}:
    get:
      operationId: organizations_retrieve
      parameters:
      - in: path
        name: entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organizations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
        '403':
          description: Installation owner with MFA required
        '404':
          description: Organization not found
    patch:
      operationId: organizations_partial_update
      parameters:
      - in: path
        name: entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
        '400':
          description: Invalid organization details
        '403':
          description: Installation owner with MFA required
        '404':
          description: Organization not found
    delete:
      operationId: organizations_destroy
      parameters:
      - in: path
        name: entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organizations
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Organization archived
        '403':
          description: Installation owner with MFA required
        '404':
          description: Organization not found
  /api/v1/workspaces/msp:
    get:
      operationId: workspaces_msp_retrieve
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceContext'
          description: ''
        '403':
          description: Installation membership required
        '503':
          description: Installation context unavailable
  /api/v1/workspaces/organizations:
    get:
      operationId: workspaces_organizations_search
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 25
          minimum: 1
          default: 15
      - in: query
        name: q
        schema:
          type: string
          default: ''
          maxLength: 80
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSearchResult'
          description: ''
        '400':
          description: Invalid search parameters
        '403':
          description: Installation owner with MFA required
  /api/v1/workspaces/organizations/{entity_id}:
    get:
      operationId: workspaces_organizations_retrieve
      parameters:
      - in: path
        name: entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceContext'
          description: ''
        '403':
          description: Installation owner with MFA required
        '404':
          description: Organization workspace not found
        '503':
          description: Installation context unavailable
components:
  schemas:
    AuthenticatedContext:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
        tenant:
          $ref: '#/components/schemas/BootstrapTenantResult'
      required:
      - tenant
      - user
    AuthenticatedUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
      required:
      - display_name
      - email
      - id
    BootstrapOwnerResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
      required:
      - display_name
      - id
    BootstrapStatus:
      type: object
      properties:
        bootstrap_required:
          type: boolean
      required:
      - bootstrap_required
    BootstrapTenantResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    ClassificationsEnum:
      enum:
      - client
      - vendor
      - manufacturer
      - partner
      type: string
      description: |-
        * `client` - Client
        * `vendor` - Vendor
        * `manufacturer` - Manufacturer
        * `partner` - Partner
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        last_sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_delivery_failed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        delivery_attempts:
          type: integer
          readOnly: true
        send_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - delivery_attempts
      - email
      - expires_at
      - id
      - last_delivery_failed_at
      - last_sent_at
      - send_count
      - state
      - updated_at
    InvitationAcceptance:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          default: ''
        display_name:
          type: string
          maxLength: 160
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - display_name
      - password
    InvitationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
    KindEnum:
      enum:
      - msp
      - organization
      type: string
      description: |-
        * `msp` - msp
        * `organization` - organization
    OidcProvider:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
    OidcProviderList:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/OidcProvider'
      required:
      - providers
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        legal_name:
          type: string
        website:
          type: string
          format: uri
        classifications:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - classifications
      - created_at
      - id
      - legal_name
      - name
      - updated_at
      - website
    OrganizationWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 240
          minLength: 1
        legal_name:
          type: string
          maxLength: 240
        website:
          type: string
          format: uri
          maxLength: 500
        classifications:
          type: array
          items:
            $ref: '#/components/schemas/ClassificationsEnum'
          maxItems: 4
          minItems: 1
      required:
      - classifications
      - name
    OwnerBootstrap:
      type: object
      properties:
        tenant_name:
          type: string
          maxLength: 160
        owner_email:
          type: string
          format: email
          maxLength: 254
        owner_display_name:
          type: string
          maxLength: 160
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - owner_display_name
      - owner_email
      - password
      - tenant_name
    OwnerBootstrapResult:
      type: object
      properties:
        tenant:
          $ref: '#/components/schemas/BootstrapTenantResult'
        owner:
          $ref: '#/components/schemas/BootstrapOwnerResult'
      required:
      - owner
      - tenant
    PatchedOrganizationWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 240
          minLength: 1
        legal_name:
          type: string
          maxLength: 240
        website:
          type: string
          format: uri
          maxLength: 500
        classifications:
          type: array
          items:
            $ref: '#/components/schemas/ClassificationsEnum'
          maxItems: 4
          minItems: 1
    PatchedProfileUpdate:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 160
          minLength: 1
    StateEnum:
      enum:
      - pending
      - expired
      - revoked
      - accepted
      type: string
      description: |-
        * `pending` - Pending
        * `expired` - Expired
        * `revoked` - Revoked
        * `accepted` - Accepted
    WorkspaceContext:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        id:
          type: string
          format: uuid
        name:
          type: string
        classifications:
          type: array
          items:
            $ref: '#/components/schemas/ClassificationsEnum'
        capabilities:
          type: array
          items:
            type: string
        organization:
          allOf:
          - $ref: '#/components/schemas/Organization'
          nullable: true
      required:
      - capabilities
      - classifications
      - id
      - kind
      - name
      - organization
    WorkspaceOption:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        classifications:
          type: array
          items:
            $ref: '#/components/schemas/ClassificationsEnum'
        capabilities:
          type: array
          items:
            type: string
      required:
      - capabilities
      - classifications
      - id
      - name
    WorkspaceSearchResult:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceOption'
        page:
          type: integer
        page_size:
          type: integer
        has_more:
          type: boolean
      required:
      - has_more
      - page
      - page_size
      - results
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
