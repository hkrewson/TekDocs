name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend
        run: |
          python -m pip install --require-hashes -r backend/build-requirements.lock
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps ./backend
      - name: Static checks
        working-directory: backend
        run: |
          ruff check .
          mypy apps tekdocs
          python manage.py makemigrations --check --dry-run --settings=tekdocs.settings.test
          python manage.py spectacular --file /tmp/openapi.yml --validate --settings=tekdocs.settings.test
          diff -u openapi.yml /tmp/openapi.yml
      - name: Backend tests
        working-directory: backend
        run: pytest --cov
      - name: Authentication abuse suite
        working-directory: backend
        run: pytest apps/accounts/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Frontend gates
        working-directory: frontend
        run: |
          npm run api:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate ephemeral environment
        run: ./scripts/bootstrap-env.sh .env
      - name: Build and start stack
        run: docker compose -f compose.yml -f compose.test.yml up -d --build --wait
      - name: Verify runtime
        run: |
          curl --fail --silent http://localhost:3200/api/v1/health/ready
          curl --fail --silent http://127.0.0.1:8025/readyz
          docker compose exec -T backend python manage.py send_test_email operator-test@example.invalid
          docker compose exec -T backend python manage.py check --deploy
          docker compose run --rm migrate pytest apps/core/tests/test_scoping.py -q
          docker compose run --rm migrate pytest apps/core/tests/test_organizations.py -q
          docker compose run --rm migrate pytest apps/core/tests/test_workspaces.py -q
          docker compose run --rm migrate pytest apps/core/tests/test_runtime_rls.py -q
          make test-documentation-certification
          make test-inventory-certification
          make test-networks
          make test-portal-notification-certification
          make test-api-contracts
          make test-api-tokens
          make test-webhooks
          make test-integrations
      - name: Collect logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: compose-smoke-logs
          path: compose.log
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Three-engine browser suite
        run: ./scripts/rehearse-browser-e2e.sh all

  live-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Real browser and production image rehearsals
        run: |
          ./scripts/rehearse-live-workspace-e2e.sh
          ./scripts/rehearse-production-image.sh
