openapi: 3.0.3
info:
  title: TekDocs API
  version: 0.0.6
  description: Self-hosted MSP knowledge and inventory API
paths:
  /api/v1/:
    get:
      operationId: root_retrieve
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/context:
    get:
      operationId: auth_context_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedContext'
          description: ''
        '403':
          description: Authentication or installation membership required
        '503':
          description: Installation context unavailable
  /api/v1/bootstrap/owner:
    post:
      operationId: bootstrap_owner_create
      parameters:
      - in: header
        name: X-TekDocs-Bootstrap-Token
        schema:
          type: string
        description: High-entropy deployment bootstrap secret
        required: true
      tags:
      - bootstrap
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerBootstrap'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OwnerBootstrap'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OwnerBootstrap'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerBootstrapResult'
          description: ''
        '400':
          description: Invalid bootstrap details
        '403':
          description: Bootstrap authorization failed
        '409':
          description: Installation already bootstrapped or not pristine
  /api/v1/bootstrap/status:
    get:
      operationId: bootstrap_status_retrieve
      tags:
      - bootstrap
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapStatus'
          description: ''
  /api/v1/health/live:
    get:
      operationId: health_live_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/health/ready:
    get:
      operationId: health_ready_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/invitations:
    get:
      operationId: invitations_list
      tags:
      - invitations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
          description: ''
        '403':
          description: Owner required
    post:
      operationId: invitations_create
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
        '400':
          description: Invalid invitation details
        '403':
          description: Owner required
        '409':
          description: Invitation conflict
        '503':
          description: Invitation retained but email delivery failed
  /api/v1/invitations/{invitation_id}/resend:
    post:
      operationId: invitations_resend_create
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - invitations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
        '403':
          description: Owner required
        '404':
          description: Invitation not found
        '409':
          description: Invitation is not pending
        '503':
          description: Invitation retained but email delivery failed
  /api/v1/invitations/{invitation_id}/revoke:
    post:
      operationId: invitations_revoke_create
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - invitations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
        '403':
          description: Owner required
        '404':
          description: Invitation not found
        '409':
          description: Invitation is not pending
  /api/v1/invitations/accept:
    post:
      operationId: invitations_accept_create
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedContext'
          description: ''
        '400':
          description: Invalid account details or password
        '403':
          description: CSRF validation failed
        '409':
          description: Sign out before accepting an invitation
        '410':
          description: Invitation unavailable
components:
  schemas:
    AuthenticatedContext:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
        tenant:
          $ref: '#/components/schemas/BootstrapTenantResult'
      required:
      - tenant
      - user
    AuthenticatedUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
      required:
      - display_name
      - email
      - id
    BootstrapOwnerResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
      required:
      - display_name
      - id
    BootstrapStatus:
      type: object
      properties:
        bootstrap_required:
          type: boolean
      required:
      - bootstrap_required
    BootstrapTenantResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        last_sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_delivery_failed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        delivery_attempts:
          type: integer
          readOnly: true
        send_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - delivery_attempts
      - email
      - expires_at
      - id
      - last_delivery_failed_at
      - last_sent_at
      - send_count
      - state
      - updated_at
    InvitationAcceptance:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          default: ''
        display_name:
          type: string
          maxLength: 160
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - display_name
      - password
    InvitationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
    OwnerBootstrap:
      type: object
      properties:
        tenant_name:
          type: string
          maxLength: 160
        owner_email:
          type: string
          format: email
          maxLength: 254
        owner_display_name:
          type: string
          maxLength: 160
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - owner_display_name
      - owner_email
      - password
      - tenant_name
    OwnerBootstrapResult:
      type: object
      properties:
        tenant:
          $ref: '#/components/schemas/BootstrapTenantResult'
        owner:
          $ref: '#/components/schemas/BootstrapOwnerResult'
      required:
      - owner
      - tenant
    StateEnum:
      enum:
      - pending
      - expired
      - revoked
      - accepted
      type: string
      description: |-
        * `pending` - Pending
        * `expired` - Expired
        * `revoked` - Revoked
        * `accepted` - Accepted
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
