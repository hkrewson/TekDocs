# Time-boxed vulnerability exceptions for container scanning.
#
# An entry here suppresses a finding that is real but not reachable in the way
# TekDocs runs the affected component. Every entry MUST carry `expired_at`, so an
# exception cannot quietly become permanent: when the date passes the gate goes red
# again and the reasoning has to be re-made against current facts.
#
# This file is not loaded automatically. It is passed with `--ignorefile` to the
# specific scan it was reasoned about, never to every scan, so an exception cannot
# drift onto an image it was never argued for.
#
# Before renewing an entry, re-scan the current pinned Mailpit image and check
# the upstream module and Go toolchain versions.

vulnerabilities:
  - id: CVE-2026-78669
    purls:
      - pkg:golang/golang.org/x/net@v0.59.0
    expired_at: 2026-10-24
    statement: >-
      The pinned Mailpit edge image uses Go 1.27.2 and x/net v0.59.0. On Go
      1.27, x/net/http2 uses the net/http wrapping implementation rather than
      its legacy HTTP/2 implementation; Go 1.27.2 fixes this SETTINGS-frame
      denial-of-service issue. The Mailpit Dockerfile does not set the
      http2legacy build tag. This exception applies only to the x/net package
      finding in the Mailpit scan, not the Go standard library or TekDocs images.
      Re-scan and remove it when Mailpit ships x/net v0.60.0; see TD-RISK-062.
