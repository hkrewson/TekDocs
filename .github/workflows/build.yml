name: Build, test, and secure

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare and validate workflow policy
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Validate version metadata
        run: |
          ./scripts/check-version.sh
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Validate pinned supply chain
        run: |
          ./scripts/check-supply-chain-pins.sh
          ./scripts/check-wiki.py
          ./scripts/check-compose-config.sh
      - name: Validate workflow syntax
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
      - name: Explain this workflow
        run: |
          {
            echo "## TekDocs validation path"
            echo
            echo "1. Backend, frontend, and security policy run in parallel."
            echo "2. The application is exercised against PostgreSQL with runtime RLS enabled."
            echo "3. Chromium and the live browser-to-Django-to-PostgreSQL journey run after that boundary passes."
            echo "4. Production containers are built, inventoried, and vulnerability-scanned last."
            echo
            echo "CodeQL and scheduled extended browser/performance/DAST checks remain separate workflows."
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend static validation
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked backend dependencies
        run: |
          python -m pip install --require-hashes -r backend/build-requirements.lock
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps ./backend
      - name: Lint, types, migrations, and OpenAPI drift
        working-directory: backend
        run: |
          ruff check .
          mypy apps tekdocs
          python manage.py makemigrations --check --dry-run --settings=tekdocs.settings.test
          python manage.py spectacular --file /tmp/openapi.yml --validate --settings=tekdocs.settings.test
          diff -u openapi.yml /tmp/openapi.yml

  frontend:
    name: Frontend code and tests
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: API drift, lint, types, tests, and bundle
        working-directory: frontend
        run: |
          npm run api:check
          npm run lint
          npm run typecheck
          npm run test -- --maxWorkers=1 --no-file-parallelism
          npm run build

  security:
    name: Dependency, license, code, and secret policy
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, SSPL-1.0, BUSL-1.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit Python dependencies and code
        run: |
          python -m pip install --require-hashes -r backend/build-requirements.lock
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps ./backend
          pip-audit --requirement backend/requirements.lock
          bandit -c backend/pyproject.toml -r backend/apps backend/tekdocs
      - name: Audit frontend dependencies and licenses
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run license:check
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  postgres-runtime:
    name: PostgreSQL backend tests, runtime, and isolation
    needs: [backend, frontend, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate ephemeral environment
        run: ./scripts/bootstrap-env.sh .env
      - name: Production-shaped Compose test gate
        run: make test-compose
      - name: Collect failure logs
        if: failure()
        run: docker compose -f compose.yml -f compose.test.yml logs --no-color > compose.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: postgres-runtime-logs
          path: compose.log
          retention-days: 7
      - name: Stop runtime stack
        if: always()
        run: docker compose -f compose.yml -f compose.test.yml down --volumes --remove-orphans

  browser:
    name: Chromium regression
    needs: postgres-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Chromium regression
        run: ./scripts/rehearse-browser-e2e.sh chromium
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-chromium-summary
          path: artifacts/playwright-safe/chromium.json
          retention-days: 7
          if-no-files-found: warn

  live-workspace:
    name: Live browser-to-PostgreSQL journey
    needs: postgres-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exercise the real application boundary
        run: ./scripts/rehearse-live-workspace-e2e.sh

  production-containers:
    name: Production containers, SBOMs, and vulnerability scan
    needs: [prepare, browser, live-workspace]
    runs-on: ubuntu-latest
    env:
      TEKDOCS_VERSION: ${{ needs.prepare.outputs.version }}
      MAILPIT_IMAGE: axllent/mailpit:edge@sha256:bccf2e68cfe67695cd6ed4d73e9def6100ea48a262901b1945befbed91cceec7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production images
        run: |
          docker build --target production --tag "tekdocs-backend:${TEKDOCS_VERSION}" ./backend
          docker build --target production --tag "tekdocs-frontend:${TEKDOCS_VERSION}" ./frontend
          docker pull "$MAILPIT_IMAGE"
      - name: Validate Python production licenses
        run: docker run --rm -v "$PWD/scripts/check-python-licenses.py:/check-python-licenses.py:ro" "tekdocs-backend:${TEKDOCS_VERSION}" python /check-python-licenses.py
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: tekdocs-backend:${{ env.TEKDOCS_VERSION }}
          format: cyclonedx-json
          output-file: backend-sbom.cdx.json
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: tekdocs-frontend:${{ env.TEKDOCS_VERSION }}
          format: cyclonedx-json
          output-file: frontend-sbom.cdx.json
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.MAILPIT_IMAGE }}
          format: cyclonedx-json
          output-file: mailpit-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-image-sboms-${{ env.TEKDOCS_VERSION }}
          path: "*-sbom.cdx.json"
          retention-days: 14
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tekdocs-backend:${{ env.TEKDOCS_VERSION }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tekdocs-frontend:${{ env.TEKDOCS_VERSION }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Scan Mailpit image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.MAILPIT_IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
