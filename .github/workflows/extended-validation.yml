name: Extended validation

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "29 8 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: extended-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schedule-gate:
    name: Check scheduled assurance freshness
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decision.outputs.run }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Find the prior scheduled run
        id: history
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if history="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/workflows/extended-validation.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f event=schedule -f per_page=2 \
            --jq '.workflow_runs | map(select(.id != (env.GITHUB_RUN_ID | tonumber))) | .[0] | [.head_sha, .conclusion] | @tsv')"; then
            if [[ -n "$history" ]]; then
              printf 'sha=%s\nconclusion=%s\n' "${history%%$'\t'*}" "${history#*$'\t'}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'GitHub history lookup failed; running assurance as the safe fallback.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Decide whether assurance is due
        id: decision
        run: >-
          python3 scripts/scheduled_assurance_gate.py
          --event-name "$GITHUB_EVENT_NAME"
          --current-sha "$GITHUB_SHA"
          --prior-sha "${{ steps.history.outputs.sha }}"
          --prior-conclusion "${{ steps.history.outputs.conclusion }}"
          --github-output "$GITHUB_OUTPUT"
      - name: Summarize decision
        run: echo '${{ steps.decision.outputs.reason }}' >> "$GITHUB_STEP_SUMMARY"

  failure-triage:
    name: Assign validation failure follow-up
    needs: [schedule-gate, browser-matrix, browser-evidence, performance, dast, supported-upgrades, supported-recovery, diagram-upgrade-and-restore-evidence]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record compact failure inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'Owner: TekDocs maintainer. Track each failure in planning/releases/validation-failures.json; see planning/releases/README.md.' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci_status.py --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  browser-matrix:
    name: Browser (${{ matrix.project }})
    needs: schedule-gate
    if: ${{ needs.schedule-gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chromium, mobile-webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./tests/rehearsals/rehearse-browser-e2e.sh ${{ matrix.project }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-${{ matrix.project }}-summary
          path: artifacts/playwright-safe/${{ matrix.project }}.json
          retention-days: 7
          if-no-files-found: warn

  browser-evidence:
    name: Browser security evidence
    needs: browser-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Write commit-bound evidence
        run: >-
          python3 scripts/write_security_evidence.py
          --category browser_security
          --scope-commit "$GITHUB_SHA"
          --tool "TekDocs Playwright desktop and mobile browser matrix"
          --tool-version "frontend lockfile at $GITHUB_SHA"
          --reference "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --immutable-identifier "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:chromium+firefox+webkit+mobile"
          --output artifacts/security-evidence/browser-security.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tekdocs-security-evidence-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/security-evidence/browser-security.json
          retention-days: 90
          if-no-files-found: error

  performance:
    name: Public-beta performance reference
    needs: schedule-gate
    if: ${{ needs.schedule-gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./scripts/bootstrap-env.sh .env
      - run: make test-public-beta-performance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: public-beta-performance
          path: artifacts/playwright-performance/
          retention-days: 14
          if-no-files-found: error

  dast:
    name: Dynamic application security test
    needs: schedule-gate
    if: ${{ needs.schedule-gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: make dast
      - name: Write commit-bound evidence
        run: >-
          python3 scripts/write_security_evidence.py
          --category dast
          --scope-commit "$GITHUB_SHA"
          --tool "OWASP ZAP passive baseline against production-shaped TekDocs"
          --tool-version "zaproxy/zap-stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef"
          --reference "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --immutable-identifier "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:dast"
          --output artifacts/security-evidence/dast.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tekdocs-security-evidence-dast-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/security-evidence/dast.json
          retention-days: 90
          if-no-files-found: error

  supported-upgrades:
    name: Supported upgrade matrix
    needs: schedule-gate
    if: ${{ needs.schedule-gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: make supported-upgrade-matrix
      - name: Rehearse document migration on fresh and upgraded data
        run: make document-migration-upgrade-rehearsal
      - name: Rehearse versioned diagram source upgrade
        run: make file-export-upgrade-rehearsal
      - name: Write commit-bound evidence
        run: >-
          python3 scripts/write_security_evidence.py
          --category upgrade
          --scope-commit "$GITHUB_SHA"
          --tool "TekDocs supported-minor production upgrade rehearsals"
          --tool-version "upgrade matrix at $GITHUB_SHA"
          --reference "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --immutable-identifier "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:supported-upgrades"
          --output artifacts/security-evidence/upgrade.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tekdocs-security-evidence-upgrade-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/security-evidence/upgrade.json
          retention-days: 90
          if-no-files-found: error

  supported-recovery:
    name: Supported backup and restore
    needs: schedule-gate
    if: ${{ needs.schedule-gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: make supported-recovery-rehearsal
      - run: make repository-foundation-acceptance
      - name: Verify recurring invoice history after restore
        run: make recurring-invoice-backup-rehearsal
      - name: Write commit-bound evidence
        run: >-
          python3 scripts/write_security_evidence.py
          --category backup_and_restore
          --scope-commit "$GITHUB_SHA"
          --tool "TekDocs encrypted recovery and repository-foundation acceptance rehearsals"
          --tool-version "recovery scripts at $GITHUB_SHA"
          --reference "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --immutable-identifier "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:supported-recovery"
          --output artifacts/security-evidence/backup-and-restore.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tekdocs-security-evidence-backup-and-restore-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/security-evidence/backup-and-restore.json
          retention-days: 90
          if-no-files-found: error

  diagram-upgrade-and-restore-evidence:
    name: Diagram upgrade and restore evidence
    needs: [supported-upgrades, supported-recovery]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record commit-bound diagram upgrade and restore evidence
        run: >-
          python3 scripts/diagram_release_evidence.py write
          --category upgrade_and_restore
          --scope-commit "$GITHUB_SHA"
          --tool "TekDocs supported upgrade and encrypted recovery rehearsals"
          --tool-version "rehearsal scripts at $GITHUB_SHA"
          --reference "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --immutable-identifier "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:diagram-upgrade+restore"
          --output artifacts/diagram-release-evidence/upgrade-and-restore.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tekdocs-diagram-evidence-upgrade-and-restore-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/diagram-release-evidence/upgrade-and-restore.json
          retention-days: 90
          if-no-files-found: error
