map $http_x_forwarded_proto $tekdocs_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 25m;

    # Declared at server level so every location inherits it. A location that sets its
    # own caching rules still needs to know where the files are.
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/(api|_allauth|admin|static)/ {
        proxy_pass http://tekdocs-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tekdocs_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Build output is content-hashed, so a given file name never changes meaning and may
    # be held for a year.
    #
    # `=404` is the half that fixes the blank page. Without it a request for a chunk that
    # no longer exists falls through to the SPA fallback below and returns index.html with
    # a 200 and a text/html type. The browser then tries to execute HTML as a module,
    # which fails silently, and the route renders blank rather than reporting an error.
    #
    # Cache lifetime is set with `expires` rather than `add_header Cache-Control`,
    # because an `add_header` at this level would discard every `add_header` inherited
    # from the server block — the security headers above included.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # The entry document names the current chunk hashes, so a cached copy outlives its
    # own assets. It must be revalidated on every load; everything else follows from it.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
