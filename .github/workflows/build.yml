name: Build, test, and secure

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare and validate workflow policy
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: version
        name: Validate version metadata
        run: |
          ./scripts/check-version.sh
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Validate pinned supply chain
        run: |
          ./scripts/check-supply-chain-pins.sh
          make test-automated-security-review-gate
          ./scripts/check-wiki.py
          ./scripts/check-compose-config.sh
      - name: Validate workflow syntax
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
      - name: Explain this workflow
        run: |
          {
            echo "## TekDocs validation path"
            echo
            echo "1. Static checks, browser journeys, the focused runtime/RLS gate, and four isolated PostgreSQL shards start in parallel."
            echo "2. PostgreSQL shard coverage is merged and enforced after every shard passes."
            echo "3. Browser and authorization failures are reported without waiting for the complete backend suite."
            echo "4. Production containers are built, inventoried, and vulnerability-scanned last."
            echo "5. Trusted main or version-tag pushes publish those exact tested images to GHCR."
            echo
            echo "CodeQL and scheduled extended browser/performance/DAST checks remain separate workflows."
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend static validation
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked backend dependencies
        run: |
          python -m pip install --require-hashes -r backend/build-requirements.lock
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps ./backend
      - name: Lint, types, migrations, and OpenAPI drift
        working-directory: backend
        run: |
          ruff check .
          mypy apps tekdocs
          python manage.py makemigrations --check --dry-run --settings=tekdocs.settings.test
          python manage.py spectacular --file /tmp/openapi.yml --validate --settings=tekdocs.settings.test
          diff -u openapi.yml /tmp/openapi.yml

  frontend:
    name: Frontend code and tests
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: API drift, lint, types, tests, and bundle
        working-directory: frontend
        run: |
          npm run api:check
          npm run lint
          npm run typecheck
          npm run test -- --maxWorkers=1 --no-file-parallelism
          npm run build

  security:
    name: Dependency, license, code, and secret policy
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, SSPL-1.0, BUSL-1.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            renderer/package-lock.json
      - name: Audit Python dependencies and code
        run: |
          python -m pip install --require-hashes -r backend/build-requirements.lock
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps ./backend
          pip-audit --requirement backend/requirements.lock
          bandit -c backend/pyproject.toml -r backend/apps backend/tekdocs
      - name: Audit frontend dependencies and licenses
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run license:check
      - name: Audit diagram renderer dependencies and licenses
        working-directory: renderer
        run: |
          npm ci --omit=dev --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          node check-licenses.mjs
      - name: Record diagram renderer dependency contract
        run: |
          python3 scripts/check_renderer_dependency_contract.py \
            --output artifacts/renderer-dependency-contract.json
          contract_digest="sha256:$(sha256sum artifacts/renderer-dependency-contract.json | cut -d ' ' -f 1)"
          python3 scripts/diagram_release_evidence.py write \
            --category dependency_contract \
            --scope-commit "$GITHUB_SHA" \
            --tool "TekDocs renderer dependency contract" \
            --tool-version "schema v1" \
            --reference "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --immutable-identifier "$contract_digest" \
            --output artifacts/diagram-release-evidence/dependency-contract.json
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write dependency, license, and secret evidence
        run: >-
          python3 scripts/write_security_evidence.py
          --category dependency_license_secret
          --scope-commit "$GITHUB_SHA"
          --tool "TekDocs locked dependency, license, Bandit, and Gitleaks gate"
          --tool-version "repository lockfiles and pinned actions at $GITHUB_SHA"
          --reference "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --immutable-identifier "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:security"
          --output artifacts/security-evidence/dependency-license-secret.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tekdocs-security-evidence-dependency-license-secret-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/security-evidence/dependency-license-secret.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tekdocs-renderer-dependency-contract-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/renderer-dependency-contract.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tekdocs-diagram-evidence-dependency-contract-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/diagram-release-evidence/dependency-contract.json
          retention-days: 90
          if-no-files-found: error

  runtime-authorization:
    name: Focused PostgreSQL runtime and RLS boundary
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Exercise the constrained runtime database role
        run: ./tests/rehearsals/rehearse-postgres-test-shard.sh runtime

  postgres-shards:
    name: PostgreSQL shard (${{ matrix.shard }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [route-access, route-methods, route-session, remaining]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run isolated PostgreSQL shard
        run: ./tests/rehearsals/rehearse-postgres-test-shard.sh "${{ matrix.shard }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgres-coverage-${{ matrix.shard }}
          path: artifacts/postgres-coverage/${{ matrix.shard }}/coverage.${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: error

  postgres-coverage:
    name: Combined PostgreSQL coverage
    needs: [prepare, postgres-shards, runtime-authorization]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: postgres-coverage-*
          path: artifacts/postgres-coverage/combined
          merge-multiple: true
      - name: Merge and enforce backend coverage
        run: ./scripts/combine-postgres-coverage.sh artifacts/postgres-coverage/combined
      - name: Write authorization and RLS evidence
        run: >-
          python3 scripts/write_security_evidence.py
          --category authorization_and_rls
          --scope-commit "$GITHUB_SHA"
          --tool "TekDocs PostgreSQL authorization, IDOR, and forced-RLS suites"
          --tool-version "TekDocs ${{ needs.prepare.outputs.version }}"
          --reference "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --immutable-identifier "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:runtime+postgres-shards"
          --output artifacts/security-evidence/authorization-and-rls.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tekdocs-security-evidence-authorization-and-rls-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/security-evidence/authorization-and-rls.json
          retention-days: 90
          if-no-files-found: error

  browser:
    name: Chromium regression
    needs: [prepare, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Chromium regression
        run: ./tests/rehearsals/rehearse-browser-e2e.sh chromium
      - name: Record diagram browser and accessibility evidence
        run: >-
          python3 scripts/diagram_release_evidence.py write
          --category browser_accessibility
          --scope-commit "$GITHUB_SHA"
          --tool "TekDocs Chromium diagram authoring and accessibility regression"
          --tool-version "TekDocs ${{ needs.prepare.outputs.version }}"
          --reference "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --immutable-identifier "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:chromium-diagrams"
          --output artifacts/diagram-release-evidence/browser-accessibility.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-chromium-summary
          path: artifacts/playwright-safe/chromium.json
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tekdocs-diagram-evidence-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/diagram-release-evidence/browser-accessibility.json
          retention-days: 90
          if-no-files-found: error

  live-workspace:
    name: Live browser-to-PostgreSQL journey
    needs: [prepare, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Exercise the real application boundary
        run: ./tests/rehearsals/rehearse-live-workspace-e2e.sh

  diagram-exports:
    name: Diagram authoring, failures, and exports
    needs: [prepare, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare the test environment
        run: ./scripts/bootstrap-env.sh .env
      - name: Run the complete diagram export gate
        run: make test-diagram-exports
      - name: Record diagram authoring and failure evidence
        run: >-
          python3 scripts/diagram_release_evidence.py write
          --category authoring_and_failures
          --scope-commit "$GITHUB_SHA"
          --tool "TekDocs diagram authoring and failure regression"
          --tool-version "TekDocs ${{ needs.prepare.outputs.version }}"
          --reference "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --immutable-identifier "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:diagram-authoring"
          --output artifacts/diagram-release-evidence/authoring-and-failures.json
      - name: Record isolated renderer and export evidence
        run: >-
          python3 scripts/diagram_release_evidence.py write
          --category renderer_and_exports
          --scope-commit "$GITHUB_SHA"
          --tool "TekDocs isolated renderer and export regression"
          --tool-version "TekDocs ${{ needs.prepare.outputs.version }}"
          --reference "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --immutable-identifier "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:renderer-exports"
          --output artifacts/diagram-release-evidence/renderer-and-exports.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tekdocs-diagram-evidence-exports-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/diagram-release-evidence/*.json
          retention-days: 90
          if-no-files-found: error

  production-containers:
    name: Production containers, SBOMs, and vulnerability scan
    needs: [prepare, backend, frontend, security, runtime-authorization, postgres-coverage, browser, live-workspace, diagram-exports]
    runs-on: ubuntu-latest
    env:
      TEKDOCS_VERSION: ${{ needs.prepare.outputs.version }}
      BACKEND_IMAGE: ghcr.io/hkrewson/tekdocs-backend
      FRONTEND_IMAGE: ghcr.io/hkrewson/tekdocs-frontend
      RENDERER_IMAGE: ghcr.io/hkrewson/tekdocs-diagram-renderer
      COMMIT_TAG: sha-${{ github.sha }}
      MAILPIT_IMAGE: axllent/mailpit:edge@sha256:d71104a14f018dadfb097d39eba737f012f29baf30d0602916b7c4fb061939b3
      TRIVY_IMAGE: aquasec/trivy:latest@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
      TRIVY_CACHE_DIR: /tmp/tekdocs-trivy-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build production images
        run: |
          docker build --target production \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${TEKDOCS_VERSION}" \
            --tag "${BACKEND_IMAGE}:${COMMIT_TAG}" ./backend
          docker build --target production \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${TEKDOCS_VERSION}" \
            --tag "${FRONTEND_IMAGE}:${COMMIT_TAG}" ./frontend
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${TEKDOCS_VERSION}" \
            --tag "${RENDERER_IMAGE}:${COMMIT_TAG}" ./renderer
          docker pull "$MAILPIT_IMAGE"
      - name: Rehearse the production diagram path
        run: sh ./tests/rehearsals/rehearse-production-image.sh
      - name: Validate Python production licenses
        run: docker run --rm -v "$PWD/scripts/check-python-licenses.py:/check-python-licenses.py:ro" "${BACKEND_IMAGE}:${COMMIT_TAG}" python /check-python-licenses.py
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.BACKEND_IMAGE }}:${{ env.COMMIT_TAG }}
          format: cyclonedx-json
          output-file: backend-sbom.cdx.json
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.FRONTEND_IMAGE }}:${{ env.COMMIT_TAG }}
          format: cyclonedx-json
          output-file: frontend-sbom.cdx.json
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.RENDERER_IMAGE }}:${{ env.COMMIT_TAG }}
          format: cyclonedx-json
          output-file: renderer-sbom.cdx.json
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.MAILPIT_IMAGE }}
          format: cyclonedx-json
          output-file: mailpit-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-image-sboms-${{ env.TEKDOCS_VERSION }}
          path: "*-sbom.cdx.json"
          retention-days: 14
      - name: Scan backend image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$TRIVY_CACHE_DIR:/root/.cache/trivy"
          "$TRIVY_IMAGE" image --skip-version-check --scanners vuln --format table
          --severity HIGH,CRITICAL --exit-code 1
          "${BACKEND_IMAGE}:${COMMIT_TAG}"
      - name: Scan frontend image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$TRIVY_CACHE_DIR:/root/.cache/trivy"
          "$TRIVY_IMAGE" image --skip-version-check --scanners vuln --format table
          --severity HIGH,CRITICAL --exit-code 1
          "${FRONTEND_IMAGE}:${COMMIT_TAG}"
      - name: Scan diagram renderer image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$TRIVY_CACHE_DIR:/root/.cache/trivy"
          "$TRIVY_IMAGE" image --skip-version-check --scanners vuln --format table
          --severity HIGH,CRITICAL --exit-code 1
          "${RENDERER_IMAGE}:${COMMIT_TAG}"
      - name: Scan Mailpit image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$TRIVY_CACHE_DIR:/root/.cache/trivy"
          -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro"
          "$TRIVY_IMAGE" image --skip-version-check --scanners vuln --format table
          --ignorefile /.trivyignore.yaml
          --severity HIGH,CRITICAL --exit-code 1
          "$MAILPIT_IMAGE"
      - name: Write production image scan evidence
        run: >-
          python3 scripts/write_security_evidence.py
          --category image_scan
          --scope-commit "$GITHUB_SHA"
          --tool "Trivy production image vulnerability scan"
          --tool-version "$TRIVY_IMAGE"
          --reference "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --immutable-identifier "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:backend+frontend+renderer+mailpit"
          --output artifacts/security-evidence/image-scan.json
      - name: Record production diagram image evidence
        run: >-
          python3 scripts/diagram_release_evidence.py write
          --category production_image
          --scope-commit "$GITHUB_SHA"
          --tool "TekDocs production-target image rehearsal"
          --tool-version "TekDocs ${{ needs.prepare.outputs.version }}"
          --reference "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --immutable-identifier "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:production-diagram-image"
          --output artifacts/diagram-release-evidence/production-image.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tekdocs-security-evidence-image-scan-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/security-evidence/image-scan.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tekdocs-diagram-evidence-production-image-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/diagram-release-evidence/production-image.json
          retention-days: 90
          if-no-files-found: error
      - name: Preserve tested application images for publication
        if: github.event_name == 'push'
        run: docker save --output production-images.tar "${BACKEND_IMAGE}:${COMMIT_TAG}" "${FRONTEND_IMAGE}:${COMMIT_TAG}" "${RENDERER_IMAGE}:${COMMIT_TAG}"
      - name: Upload tested application images
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-images-${{ github.sha }}
          path: production-images.tar
          retention-days: 1
          compression-level: 0

  publish-containers:
    name: Publish tested production images
    if: github.event_name == 'push'
    needs: [prepare, production-containers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      TEKDOCS_VERSION: ${{ needs.prepare.outputs.version }}
      BACKEND_IMAGE: ghcr.io/hkrewson/tekdocs-backend
      FRONTEND_IMAGE: ghcr.io/hkrewson/tekdocs-frontend
      RENDERER_IMAGE: ghcr.io/hkrewson/tekdocs-diagram-renderer
      COMMIT_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download tested application images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-images-${{ github.sha }}
      - name: Download generated SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-image-sboms-${{ env.TEKDOCS_VERSION }}
      - name: Load tested application images
        run: docker load --input production-images.tar
      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          if [[ "$GITHUB_REF_NAME" != "v${TEKDOCS_VERSION}" ]]; then
            echo "Release tag must equal v${TEKDOCS_VERSION}; received ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
      - name: Authenticate to GitHub Container Registry
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        name: Publish commit-addressed production images
        run: |
          docker push "${BACKEND_IMAGE}:${COMMIT_TAG}"
          docker push "${FRONTEND_IMAGE}:${COMMIT_TAG}"
          docker push "${RENDERER_IMAGE}:${COMMIT_TAG}"

          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == "main" ]]; then
            docker tag "${BACKEND_IMAGE}:${COMMIT_TAG}" "${BACKEND_IMAGE}:main"
            docker tag "${FRONTEND_IMAGE}:${COMMIT_TAG}" "${FRONTEND_IMAGE}:main"
            docker tag "${RENDERER_IMAGE}:${COMMIT_TAG}" "${RENDERER_IMAGE}:main"
            docker push "${BACKEND_IMAGE}:main"
            docker push "${FRONTEND_IMAGE}:main"
            docker push "${RENDERER_IMAGE}:main"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            docker tag "${BACKEND_IMAGE}:${COMMIT_TAG}" "${BACKEND_IMAGE}:${TEKDOCS_VERSION}"
            docker tag "${FRONTEND_IMAGE}:${COMMIT_TAG}" "${FRONTEND_IMAGE}:${TEKDOCS_VERSION}"
            docker tag "${RENDERER_IMAGE}:${COMMIT_TAG}" "${RENDERER_IMAGE}:${TEKDOCS_VERSION}"
            docker push "${BACKEND_IMAGE}:${TEKDOCS_VERSION}"
            docker push "${FRONTEND_IMAGE}:${TEKDOCS_VERSION}"
            docker push "${RENDERER_IMAGE}:${TEKDOCS_VERSION}"
          fi

          backend_digest=$(docker buildx imagetools inspect "${BACKEND_IMAGE}:${COMMIT_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          frontend_digest=$(docker buildx imagetools inspect "${FRONTEND_IMAGE}:${COMMIT_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          renderer_digest=$(docker buildx imagetools inspect "${RENDERER_IMAGE}:${COMMIT_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$backend_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid backend registry digest" >&2; exit 1; }
          [[ "$frontend_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid frontend registry digest" >&2; exit 1; }
          [[ "$renderer_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid diagram renderer registry digest" >&2; exit 1; }
          {
            echo "backend-digest=$backend_digest"
            echo "frontend-digest=$frontend_digest"
            echo "renderer-digest=$renderer_digest"
          } >> "$GITHUB_OUTPUT"
      - name: Attest backend build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.backend-digest }}
          push-to-registry: true
      - name: Attest frontend build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.frontend-digest }}
          push-to-registry: true
      - name: Attest diagram renderer build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.RENDERER_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.renderer-digest }}
          push-to-registry: true
      - name: Attest backend SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.backend-digest }}
          sbom-path: backend-sbom.cdx.json
          push-to-registry: true
      - name: Attest frontend SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.frontend-digest }}
          sbom-path: frontend-sbom.cdx.json
          push-to-registry: true
      - name: Attest diagram renderer SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ env.RENDERER_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.renderer-digest }}
          sbom-path: renderer-sbom.cdx.json
          push-to-registry: true
      - name: Write image, SBOM, and provenance evidence
        run: >-
          python3 scripts/write_security_evidence.py
          --category production_images_sbom_provenance
          --scope-commit "$GITHUB_SHA"
          --tool "GitHub artifact attestations and CycloneDX image SBOMs"
          --tool-version "actions/attest@a1948c3f048ba23858d222213b7c278aabede763"
          --reference "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --immutable-identifier "${{ steps.publish.outputs.backend-digest }}:${{ steps.publish.outputs.frontend-digest }}:${{ steps.publish.outputs.renderer-digest }}"
          --output artifacts/security-evidence/production-images-sbom-provenance.json
      - name: Record diagram renderer supply-chain evidence
        run: >-
          python3 scripts/diagram_release_evidence.py write
          --category supply_chain
          --scope-commit "$GITHUB_SHA"
          --tool "TekDocs renderer audit, scan, SBOM, and provenance gate"
          --tool-version "TekDocs ${{ needs.prepare.outputs.version }}"
          --reference "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --immutable-identifier "${{ steps.publish.outputs.renderer-digest }}"
          --output artifacts/diagram-release-evidence/supply-chain.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tekdocs-security-evidence-production-images-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/security-evidence/production-images-sbom-provenance.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tekdocs-diagram-evidence-supply-chain-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/diagram-release-evidence/supply-chain.json
          retention-days: 90
          if-no-files-found: error
      - name: Summarize published images
        run: |
          {
            echo "## Published production images"
            echo
            echo "- \`${BACKEND_IMAGE}:${COMMIT_TAG}\`"
            echo "- \`${FRONTEND_IMAGE}:${COMMIT_TAG}\`"
            echo "- \`${RENDERER_IMAGE}:${COMMIT_TAG}\`"
            echo
            echo "Production deployments resolve these commit tags to immutable registry digests."
            echo "The package visibility must be Public in GitHub Packages for unauthenticated production pulls."
          } >> "$GITHUB_STEP_SUMMARY"
