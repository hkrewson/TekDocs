components:
  schemas:
    AuthenticatedContext:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
        tenant:
          $ref: '#/components/schemas/BootstrapTenantResult'
      required:
      - tenant
      - user
    AuthenticatedUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
      required:
      - display_name
      - email
      - id
    BootstrapOwnerResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
      required:
      - display_name
      - id
    BootstrapStatus:
      type: object
      properties:
        bootstrap_required:
          type: boolean
      required:
      - bootstrap_required
    BootstrapTenantResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    CustomFieldDefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        entity_type:
          type: string
        owner:
          type: string
          readOnly: true
        organization_id:
          type: string
          nullable: true
          readOnly: true
        inherited:
          type: boolean
          readOnly: true
        archived:
          type: boolean
          readOnly: true
        current_version:
          type: object
          additionalProperties: {}
          readOnly: true
        versions:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldVersion'
      required:
      - archived
      - current_version
      - entity_type
      - id
      - inherited
      - key
      - organization_id
      - owner
      - versions
    CustomFieldDefinitionResult:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldDefinition'
        count:
          type: integer
      required:
      - count
      - results
    CustomFieldDefinitionVersionResult:
      type: object
      properties:
        definition:
          $ref: '#/components/schemas/CustomFieldDefinition'
        migration_impact:
          $ref: '#/components/schemas/MigrationImpact'
      required:
      - definition
      - migration_impact
    CustomFieldDefinitionWrite:
      type: object
      properties:
        label:
          type: string
          maxLength: 160
          minLength: 1
        description:
          type: string
          maxLength: 500
        required:
          type: boolean
          default: false
        field_type:
          $ref: '#/components/schemas/FieldTypeEnum'
        display_order:
          type: integer
          maximum: 1000
          minimum: -1000
          default: 0
        options:
          type: array
          items:
            type: string
            maxLength: 160
            minLength: 1
          maxItems: 50
        key:
          type: string
          description: Stable lowercase key beginning with a letter.
          maxLength: 80
          minLength: 1
          pattern: ^[a-z][a-z0-9_-]*$
