name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install --upgrade pip && python -m pip install './backend[dev]'
      - name: Static checks
        working-directory: backend
        run: |
          ruff check .
          mypy apps tekdocs
          python manage.py makemigrations --check --dry-run --settings=tekdocs.settings.test
          python manage.py spectacular --file /tmp/openapi.yml --validate --settings=tekdocs.settings.test
          diff -u openapi.yml /tmp/openapi.yml
      - name: Backend tests
        working-directory: backend
        run: pytest --cov

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Frontend gates
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral environment
        run: ./scripts/bootstrap-env.sh .env
      - name: Build and start stack
        run: docker compose -f compose.yml -f compose.test.yml up -d --build --wait
      - name: Verify runtime
        run: |
          curl --fail --silent http://localhost:3200/api/v1/health/ready
          curl --fail --silent http://127.0.0.1:8025/readyz
          docker compose exec -T backend python manage.py send_test_email operator-test@example.invalid
          docker compose exec -T backend python manage.py check --deploy
      - name: Collect logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-smoke-logs
          path: compose.log
          retention-days: 7
