openapi: 3.0.3
info:
  title: TekDocs API
  version: 0.2.5
  description: Self-hosted MSP knowledge and inventory API
paths:
  /api/v1/:
    get:
      operationId: root_retrieve
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/access-control/catalog:
    get:
      operationId: access_control_catalog_retrieve
      tags:
      - access-control
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlCatalog'
          description: ''
        '403':
          description: Member administration permission required
  /api/v1/access-control/collections:
    get:
      operationId: access_control_collections_list
      tags:
      - access-control
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessCollection'
          description: ''
    post:
      operationId: access_control_collections_create
      tags:
      - access-control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessCollectionWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccessCollectionWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccessCollectionWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCollection'
          description: ''
  /api/v1/access-control/collections/{collection_id}:
    patch:
      operationId: access_control_collections_partial_update
      parameters:
      - in: path
        name: collection_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access-control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccessCollectionWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccessCollectionWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccessCollectionWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCollection'
          description: ''
    delete:
      operationId: access_control_collections_destroy
      parameters:
      - in: path
        name: collection_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access-control
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCollection'
          description: ''
  /api/v1/access-control/custom-roles:
    get:
      operationId: access_control_custom_roles_list
      tags:
      - access-control
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomRole'
          description: ''
    post:
      operationId: access_control_custom_roles_create
      tags:
      - access-control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomRoleCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomRoleCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomRoleCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRole'
          description: ''
  /api/v1/access-control/custom-roles/{role_id}:
    patch:
      operationId: access_control_custom_roles_partial_update
      parameters:
      - in: path
        name: role_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access-control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomRoleUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomRoleUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomRoleUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRole'
          description: ''
    delete:
      operationId: access_control_custom_roles_destroy
      parameters:
      - in: path
        name: role_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access-control
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRole'
          description: ''
  /api/v1/access-control/members:
    get:
      operationId: access_control_members_list
      tags:
      - access-control
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
          description: ''
        '403':
          description: Member administration permission required
  /api/v1/access-control/members/{user_id}:
    patch:
      operationId: access_control_members_partial_update
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access-control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMemberRoleWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMemberRoleWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMemberRoleWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '400':
          description: Invalid or non-assignable role
        '403':
          description: Role assignment permission and MFA required
        '404':
          description: Tenant member not found
  /api/v1/access-control/organizations:
    get:
      operationId: access_control_organizations_list
      tags:
      - access-control
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationAccess'
          description: ''
        '403':
          description: Organization access administration permission and MFA required
  /api/v1/access-control/organizations/{organization_entity_id}:
    patch:
      operationId: access_control_organizations_partial_update
      parameters:
      - in: path
        name: organization_entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access-control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationAccessWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationAccessWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationAccessWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAccess'
          description: ''
        '400':
          description: Invalid access mode
        '403':
          description: Organization access administration permission and MFA required
        '404':
          description: Organization not found
  /api/v1/access-control/organizations/{organization_entity_id}/staff:
    post:
      operationId: access_control_organizations_staff_create
      parameters:
      - in: path
        name: organization_entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access-control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationStaffWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationStaffWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationStaffWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAccess'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAccess'
          description: ''
        '400':
          description: The owner cannot be assigned explicitly
        '403':
          description: Staff assignment permission and MFA required
        '404':
          description: Organization or tenant member not found
  /api/v1/access-control/organizations/{organization_entity_id}/staff/{user_id}:
    delete:
      operationId: access_control_organizations_staff_destroy
      parameters:
      - in: path
        name: organization_entity_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access-control
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationAccess'
          description: ''
        '403':
          description: Staff assignment permission and MFA required
        '404':
          description: Organization not found
  /api/v1/access-control/role-assignments:
    get:
      operationId: access_control_role_assignments_list
      tags:
      - access-control
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScopedRoleAssignment'
          description: ''
    post:
      operationId: access_control_role_assignments_create
      tags:
      - access-control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopedRoleAssignmentWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScopedRoleAssignmentWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScopedRoleAssignmentWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopedRoleAssignment'
          description: ''
  /api/v1/access-control/role-assignments/{assignment_id}:
    delete:
      operationId: access_control_role_assignments_destroy
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access-control
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/context:
    get:
      operationId: auth_context_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedContext'
          description: ''
        '403':
          description: Authentication or installation membership required
        '503':
          description: Installation context unavailable
  /api/v1/auth/profile:
    patch:
      operationId: auth_profile_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedContext'
          description: ''
        '400':
          description: Invalid profile details
        '403':
          description: Authentication or installation membership required
  /api/v1/auth/providers:
    get:
      operationId: auth_providers_retrieve
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcProviderList'
          description: ''
  /api/v1/bootstrap/owner:
    post:
      operationId: bootstrap_owner_create
      parameters:
      - in: header
        name: X-TekDocs-Bootstrap-Token
        schema:
          type: string
        description: High-entropy deployment bootstrap secret
        required: true
      tags:
      - bootstrap
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerBootstrap'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OwnerBootstrap'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OwnerBootstrap'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerBootstrapResult'
          description: ''
        '400':
          description: Invalid bootstrap details
        '403':
          description: Bootstrap authorization failed
        '409':
          description: Installation already bootstrapped or not pristine
  /api/v1/bootstrap/status:
    get:
      operationId: bootstrap_status_retrieve
      tags:
      - bootstrap
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapStatus'
          description: ''
  /api/v1/custom-field-definitions:
    get:
      operationId: custom_fields_msp_list
      tags:
      - custom-field-definitions
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldDefinitionResult'
          description: ''
    post:
      operationId: custom_fields_msp_create
      tags:
      - custom-field-definitions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldDefinitionWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomFieldDefinitionWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomFieldDefinitionWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldDefinition'
          description: ''
  /api/v1/custom-field-definitions/{definition_id}:
    patch:
      operationId: custom_fields_msp_version
      parameters:
      - in: path
        name: definition_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - custom-field-definitions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomFieldVersionWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomFieldVersionWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomFieldVersionWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldDefinitionVersionResult'
          description: ''
    delete:
      operationId: custom_fields_msp_archive
      parameters:
      - in: path
        name: definition_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - custom-field-definitions
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/documents:
    get:
      operationId: documents_msp_list
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResult'
          description: ''
    post:
      operationId: documents_msp_create
      tags:
      - documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
  /api/v1/documents/{document_entity_id}:
    get:
      operationId: documents_msp_retrieve
      parameters:
      - in: path
        name: document_entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
    put:
      operationId: documents_msp_update
      parameters:
      - in: path
        name: document_entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUpdate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionConflict'
          description: ''
    delete:
      operationId: documents_msp_archive
      parameters:
      - in: path
        name: document_entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '409':
          description: Placement dependency conflict
  /api/v1/documents/{document_entity_id}/placements:
    post:
      operationId: document_placements_msp_create
      parameters:
      - in: path
        name: document_entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentPlacementWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentPlacementWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentPlacementWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
        '409':
          description: Placement conflict
  /api/v1/documents/{document_entity_id}/placements/{placement_id}:
    patch:
      operationId: document_placements_msp_update
      parameters:
      - in: path
        name: document_entity_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: placement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDocumentPlacementUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDocumentPlacementUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDocumentPlacementUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
        '409':
          description: Placement conflict
    delete:
      operationId: document_placements_msp_destroy
      parameters:
      - in: path
        name: document_entity_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: placement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
        '409':
          description: Placement conflict
  /api/v1/documents/{document_entity_id}/placements/{placement_id}/detach:
    post:
      operationId: document_placement_msp_detach
      parameters:
      - in: path
        name: document_entity_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: placement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
        '409':
          description: Placement conflict
  /api/v1/documents/{document_entity_id}/placements/{placement_id}/reuse:
    get:
      operationId: document_placement_reuse_msp_retrieve
      parameters:
      - in: path
        name: document_entity_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: placement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReuseImpact'
          description: ''
    put:
      operationId: document_placement_shared_block_msp_update
      parameters:
      - in: path
        name: document_entity_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: placement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedBlockUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SharedBlockUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SharedBlockUpdate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionConflict'
          description: ''
  /api/v1/documents/{document_entity_id}/references:
    get:
      operationId: document_references_list
      parameters:
      - in: path
        name: document_entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - documents
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentationReference'
          description: ''
    post:
      operationId: document_references_create
      parameters:
      - in: path
        name: document_entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentationReferenceWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DocumentationReferenceWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentationReferenceWrite'
        required: true
