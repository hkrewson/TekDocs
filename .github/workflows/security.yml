name: Security and supply chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "29 8 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, SSPL-1.0, BUSL-1.1

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: python -m pip install './backend[dev]' && pip-audit
      - working-directory: frontend
        run: npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/bootstrap-env.sh .env
      - run: docker compose build backend frontend
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: tekdocs-backend
          format: sarif
          output: backend-trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: tekdocs-frontend
          format: sarif
          output: frontend-trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: anchore/sbom-action@v0
        with:
          image: tekdocs-backend
          format: cyclonedx-json
          output-file: backend-sbom.cdx.json
      - uses: anchore/sbom-action@v0
        with:
          image: tekdocs-frontend
          format: cyclonedx-json
          output-file: frontend-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-sboms
          path: "*-sbom.cdx.json"
