name: Browser regression

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * 2"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'pull_request' && '["chromium"]' || '["chromium", "firefox", "webkit"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./scripts/bootstrap-env.sh .env
      - run: docker compose up -d --build --wait
      - working-directory: frontend
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps ${{ matrix.browser }}
      - working-directory: frontend
        run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}-artifacts
          path: artifacts/
          retention-days: 7
