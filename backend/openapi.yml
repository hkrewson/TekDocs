components:
  schemas:
    AccessCollection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/AccessCollectionOrganization'
        assignment_count:
          type: integer
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - archived_at
      - assignment_count
      - created_at
      - description
      - id
      - name
      - organizations
      - updated_at
    AccessCollectionOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    AccessCollectionWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        description:
          type: string
          default: ''
          maxLength: 500
        organization_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - name
      - organization_ids
    AccessControlCatalog:
      type: object
      properties:
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionDefinition'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleDefinition'
        custom_assignable_permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionDefinition'
      required:
      - custom_assignable_permissions
      - permissions
      - roles
    AssignableScopeEnum:
      enum:
      - installation
      - tenant
      - organization
      type: string
      description: |-
        * `installation` - installation
        * `tenant` - tenant
        * `organization` - organization
    AssignedStaff:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/TenantAssignableRoleEnum'
      required:
      - display_name
      - email
      - id
      - role
    AuthenticatedContext:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
        tenant:
          $ref: '#/components/schemas/BootstrapTenantResult'
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
      required:
      - permissions
      - role
      - tenant
      - user
    AuthenticatedUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
      required:
      - display_name
      - email
      - id
    BlockRevision:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        revision_number:
          type: integer
        checksum:
          type: string
        created_by:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
        is_current:
          type: boolean
          readOnly: true
      required:
      - checksum
      - created_at
      - created_by
      - id
      - is_current
      - parent_id
      - revision_number
    BlockRevisionDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        revision_number:
          type: integer
        checksum:
          type: string
        created_by:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
        is_current:
          type: boolean
          readOnly: true
        markdown:
          type: string
        diff_from_parent:
          type: string
          readOnly: true
      required:
      - checksum
      - created_at
      - created_by
      - diff_from_parent
      - id
      - is_current
      - markdown
      - parent_id
      - revision_number
    BlockRevisionResult:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BlockRevision'
        count:
          type: integer
      required:
      - count
      - results
    BootstrapOwnerResult:
      type: object
