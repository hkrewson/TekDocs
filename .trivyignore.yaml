# Time-boxed vulnerability exceptions for container scanning.
#
# An entry here suppresses a finding that is real but not reachable in the way
# TekDocs runs the affected component. Every entry MUST carry `expired_at`, so an
# exception cannot quietly become permanent: when the date passes the gate goes red
# again and the reasoning has to be re-made against current facts.
#
# This file is not loaded automatically. It is passed with `--ignorefile` to the
# specific scan it was reasoned about, never to every scan, so an exception cannot
# drift onto an image it was never argued for.
#
# Before renewing an entry, re-check the current pinned Mailpit image first and
# confirm whether its Alpine packages include OpenSSL 3.5.8-r0 or later.

vulnerabilities:
  - id: CVE-2026-14456
    expired_at: 2026-09-10
    statement: >-
      The current Mailpit edge digest fixes its previously excepted Go module
      findings but still contains Alpine's libcrypto3 and libssl3 3.5.7-r0. Mailpit
      is a statically linked Go binary (ldd reports it is not a dynamic program), so
      it does not load either library; TekDocs exposes no OpenSSL QUIC server, the
      vulnerable path. Mailpit's UI is bound to localhost and SMTP remains on the
      internal Compose network. Re-evaluate on expiry; see TD-RISK-062.
