name: CodeQL

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 3"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  schedule-gate:
    name: Check scheduled assurance freshness
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decision.outputs.run }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Find the prior scheduled run
        id: history
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if history="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/workflows/codeql.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f event=schedule -f per_page=2 \
            --jq '.workflow_runs | map(select(.id != (env.GITHUB_RUN_ID | tonumber))) | .[0] | [.head_sha, .conclusion] | @tsv')"; then
            if [[ -n "$history" ]]; then
              printf 'sha=%s\nconclusion=%s\n' "${history%%$'\t'*}" "${history#*$'\t'}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'GitHub history lookup failed; running assurance as the safe fallback.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Decide whether assurance is due
        id: decision
        run: >-
          python3 scripts/scheduled_assurance_gate.py
          --event-name "$GITHUB_EVENT_NAME"
          --current-sha "$GITHUB_SHA"
          --prior-sha "${{ steps.history.outputs.sha }}"
          --prior-conclusion "${{ steps.history.outputs.conclusion }}"
          --github-output "$GITHUB_OUTPUT"
      - name: Summarize decision
        run: echo '${{ steps.decision.outputs.reason }}' >> "$GITHUB_STEP_SUMMARY"

  analyze:
    needs: schedule-gate
    if: ${{ needs.schedule-gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4

  evidence:
    name: CodeQL evidence
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Write commit-bound evidence
        run: >-
          python3 scripts/write_security_evidence.py
          --category codeql
          --scope-commit "$GITHUB_SHA"
          --tool "GitHub CodeQL security-extended and security-and-quality"
          --tool-version "github/codeql-action@9b3254085494b55a0f7c4c2b3d2d52cc712ce370"
          --reference "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --immutable-identifier "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:python+javascript-typescript"
          --output artifacts/security-evidence/codeql.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tekdocs-security-evidence-codeql-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/security-evidence/codeql.json
          retention-days: 90
          if-no-files-found: error
