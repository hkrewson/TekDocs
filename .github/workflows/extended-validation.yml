name: Extended validation

on:
  workflow_dispatch:
  schedule:
    - cron: "29 8 * * 1"

permissions:
  contents: read

concurrency:
  group: extended-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-matrix:
    name: Browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chromium, mobile-webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./tests/rehearsals/rehearse-browser-e2e.sh ${{ matrix.project }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-${{ matrix.project }}-summary
          path: artifacts/playwright-safe/${{ matrix.project }}.json
          retention-days: 7
          if-no-files-found: warn

  performance:
    name: Public-beta performance reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./scripts/bootstrap-env.sh .env
      - run: make test-public-beta-performance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: public-beta-performance
          path: artifacts/playwright-performance/
          retention-days: 14

  dast:
    name: Dynamic application security test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: make dast
