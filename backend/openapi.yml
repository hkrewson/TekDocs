openapi: 3.0.3
info:
  title: TekDocs API
  version: 0.1.8
  description: Self-hosted MSP knowledge and inventory API
paths:
  /api/v1/:
    get:
      operationId: root_retrieve
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/context:
    get:
      operationId: auth_context_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedContext'
          description: ''
        '403':
          description: Authentication or installation membership required
        '503':
          description: Installation context unavailable
  /api/v1/auth/profile:
    patch:
      operationId: auth_profile_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedContext'
          description: ''
        '400':
          description: Invalid profile details
        '403':
          description: Authentication or installation membership required
  /api/v1/auth/providers:
    get:
      operationId: auth_providers_retrieve
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcProviderList'
          description: ''
  /api/v1/bootstrap/owner:
    post:
      operationId: bootstrap_owner_create
      parameters:
      - in: header
        name: X-TekDocs-Bootstrap-Token
        schema:
          type: string
        description: High-entropy deployment bootstrap secret
        required: true
      tags:
      - bootstrap
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerBootstrap'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OwnerBootstrap'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OwnerBootstrap'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerBootstrapResult'
          description: ''
        '400':
          description: Invalid bootstrap details
        '403':
          description: Bootstrap authorization failed
        '409':
          description: Installation already bootstrapped or not pristine
  /api/v1/bootstrap/status:
    get:
      operationId: bootstrap_status_retrieve
      tags:
      - bootstrap
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapStatus'
          description: ''
  /api/v1/custom-field-definitions:
    get:
      operationId: custom_fields_msp_list
      tags:
      - custom-field-definitions
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldDefinitionResult'
          description: ''
    post:
      operationId: custom_fields_msp_create
      tags:
      - custom-field-definitions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldDefinitionWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomFieldDefinitionWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomFieldDefinitionWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldDefinition'
          description: ''
  /api/v1/custom-field-definitions/{definition_id}:
    patch:
      operationId: custom_fields_msp_version
      parameters:
      - in: path
        name: definition_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - custom-field-definitions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomFieldVersionWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomFieldVersionWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomFieldVersionWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldDefinitionVersionResult'
          description: ''
    delete:
      operationId: custom_fields_msp_archive
      parameters:
      - in: path
        name: definition_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - custom-field-definitions
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/entities/{entity_id}/custom-fields:
    get:
      operationId: entity_custom_fields_msp_list
      parameters:
      - in: path
        name: entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - entities
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityCustomFieldResult'
          description: ''
  /api/v1/entities/{entity_id}/custom-fields/{definition_id}:
    patch:
      operationId: entity_custom_fields_msp_set
      parameters:
      - in: path
        name: definition_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - entities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomFieldValueWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomFieldValueWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomFieldValueWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityCustomFieldResult'
          description: ''
    delete:
      operationId: entity_custom_fields_msp_clear
      parameters:
      - in: path
        name: definition_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - entities
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/entities/{entity_id}/links:
    get:
      operationId: msp_entity_relationships_list
      parameters:
      - in: path
        name: entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - entities
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityRelationshipResult'
          description: ''
        '403':
          description: Workspace access required
        '404':
          description: Entity not found in workspace
    post:
      operationId: msp_entity_relationships_create
      parameters:
      - in: path
        name: entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - entities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityLinkWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EntityLinkWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EntityLinkWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityRelationship'
          description: ''
        '400':
          description: Invalid or duplicate relationship
        '403':
          description: Installation owner with MFA required
        '404':
          description: Entity not found in workspace
  /api/v1/entities/{entity_id}/links/{link_id}:
    delete:
      operationId: msp_entity_relationships_archive
      parameters:
      - in: path
        name: entity_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: link_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - entities
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Relationship archived
        '403':
          description: Installation owner with MFA required
        '404':
          description: Relationship not found in workspace
  /api/v1/entities/search:
    get:
      operationId: msp_entities_search
      parameters:
      - in: query
        name: entity_type
        schema:
          enum:
          - organization
          - person
          - site
          - location
          - ''
          type: string
          default: ''
        description: |-
          * `organization` - organization
          * `person` - person
          * `site` - site
          * `location` - location
      - in: query
        name: page
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 25
          minimum: 1
          default: 15
      - in: query
        name: q
        schema:
          type: string
          default: ''
          maxLength: 80
      tags:
      - entities
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitySearchResult'
          description: ''
        '400':
          description: Invalid search parameters
        '403':
          description: Workspace access required
        '404':
          description: Organization workspace not found
  /api/v1/entity-link-types:
    get:
      operationId: entity_link_types_list
      tags:
      - entity-link-types
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityLinkType'
          description: ''
        '403':
          description: Installation membership required
  /api/v1/health/live:
    get:
      operationId: health_live_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/health/ready:
    get:
      operationId: health_ready_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/invitations:
    get:
      operationId: invitations_list
      tags:
      - invitations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
          description: ''
        '403':
          description: Owner required
    post:
      operationId: invitations_create
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
        '400':
          description: Invalid invitation details
        '403':
          description: Owner required
        '409':
          description: Invitation conflict
        '503':
          description: Invitation retained but email delivery failed
  /api/v1/invitations/{invitation_id}/resend:
    post:
      operationId: invitations_resend_create
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - invitations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
        '403':
          description: Owner required
        '404':
          description: Invitation not found
        '409':
          description: Invitation is not pending
        '503':
          description: Invitation retained but email delivery failed
  /api/v1/invitations/{invitation_id}/revoke:
    post:
      operationId: invitations_revoke_create
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - invitations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
        '403':
          description: Owner required
        '404':
          description: Invitation not found
        '409':
          description: Invitation is not pending
  /api/v1/invitations/accept:
    post:
      operationId: invitations_accept_create
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedContext'
          description: ''
        '400':
          description: Invalid account details or password
        '403':
          description: CSRF validation failed
        '409':
          description: Sign out before accepting an invitation
        '410':
          description: Invitation unavailable
  /api/v1/organizations:
    get:
      operationId: organizations_list
      tags:
      - organizations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
          description: ''
        '403':
          description: Installation owner with MFA required
    post:
      operationId: organizations_create
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
        '400':
          description: Invalid organization details
        '403':
          description: Installation owner with MFA required
  /api/v1/organizations/{entity_id}:
    get:
      operationId: organizations_retrieve
      parameters:
      - in: path
        name: entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organizations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
        '403':
          description: Installation owner with MFA required
        '404':
          description: Organization not found
    patch:
      operationId: organizations_partial_update
      parameters:
      - in: path
        name: entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
        '400':
          description: Invalid organization details
        '403':
          description: Installation owner with MFA required
        '404':
          description: Organization not found
    delete:
      operationId: organizations_destroy
      parameters:
      - in: path
        name: entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - organizations
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Organization archived
        '403':
          description: Installation owner with MFA required
        '404':
          description: Organization not found
  /api/v1/people:
    get:
      operationId: people_msp_list
      parameters:
      - in: query
        name: filter_field
        schema:
          type: string
      - in: query
        name: filter_value
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search every displayed person and association field.
      tags:
      - people
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleResult'
          description: ''
        '403':
          description: No response body
    post:
      operationId: people_msp_create
      tags:
      - people
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PersonWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PersonWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
          description: ''
        '403':
          description: No response body
  /api/v1/people/{person_entity_id}:
    get:
      operationId: people_msp_retrieve
      parameters:
      - in: path
        name: person_entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - people
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
          description: ''
        '404':
          description: No response body
    patch:
      operationId: people_msp_update
      parameters:
      - in: path
        name: person_entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - people
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPersonWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPersonWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPersonWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
          description: ''
        '404':
          description: No response body
    delete:
      operationId: people_msp_archive
      parameters:
      - in: path
        name: person_entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - people
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '404':
          description: No response body
  /api/v1/sites:
    get:
      operationId: sites_msp_list
      parameters:
      - in: query
        name: q
        schema:
          type: string
      tags:
      - sites
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteResult'
          description: ''
    post:
      operationId: sites_msp_create
      tags:
      - sites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SiteWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SiteWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
          description: ''
  /api/v1/sites/{site_entity_id}:
    get:
      operationId: sites_msp_retrieve
      parameters:
      - in: path
        name: site_entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sites
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
          description: ''
        '404':
          description: No response body
    patch:
      operationId: sites_msp_update
      parameters:
      - in: path
        name: site_entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSiteWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSiteWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSiteWrite'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
          description: ''
    delete:
      operationId: sites_msp_archive
      parameters:
      - in: path
        name: site_entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sites
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/sites/{site_entity_id}/locations:
    post:
      operationId: locations_msp_create
      parameters:
      - in: path
        name: site_entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LocationWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LocationWrite'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
          description: ''
  /api/v1/sites/{site_entity_id}/locations/{location_entity_id}:
    patch:
      operationId: locations_msp_update
      parameters:
      - in: path
        name: location_entity_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: site_entity_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sites
      requestBody:
