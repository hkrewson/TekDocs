services:
  db:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
    secrets:
      - postgres_owner_password

  migrate:
    environment: &migration-secret-files
      DJANGO_SECRET_KEY: ""
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
      TEKDOCS_DATABASE_RUNTIME_PASSWORD: ""
      TEKDOCS_DATABASE_RUNTIME_PASSWORD_FILE: /run/secrets/postgres_runtime_password
      TEKDOCS_MASTER_KEY: ""
      TEKDOCS_MASTER_KEY_FILE: /run/secrets/tekdocs_master_key
      TEKDOCS_PUBLICATION_SIGNING_KEY: ""
      TEKDOCS_PUBLICATION_SIGNING_KEY_FILE: /run/secrets/publication_signing_key
      TEKDOCS_SECRET_ROOT: /run/secrets
    secrets:
      - django_secret_key
      - postgres_owner_password
      - postgres_runtime_password
      - tekdocs_master_key
      - publication_signing_key

  backend:
    environment: &runtime-secret-files
      DJANGO_SECRET_KEY: ""
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_runtime_password
      TEKDOCS_MASTER_KEY: ""
      TEKDOCS_MASTER_KEY_FILE: /run/secrets/tekdocs_master_key
      TEKDOCS_PUBLICATION_SIGNING_KEY: ""
      TEKDOCS_PUBLICATION_SIGNING_KEY_FILE: /run/secrets/publication_signing_key
      TEKDOCS_SECRET_ROOT: /run/secrets
    secrets: &runtime-secrets
      - django_secret_key
      - postgres_runtime_password
      - tekdocs_master_key
      - publication_signing_key

  worker:
    environment: *runtime-secret-files
    secrets: *runtime-secrets

  scheduler:
    environment: *runtime-secret-files
    secrets: *runtime-secrets

secrets:
  django_secret_key:
    file: ${TEKDOCS_SECRET_DIRECTORY:?Set TEKDOCS_SECRET_DIRECTORY}/django_secret_key
  postgres_owner_password:
    file: ${TEKDOCS_SECRET_DIRECTORY:?Set TEKDOCS_SECRET_DIRECTORY}/postgres_owner_password
  postgres_runtime_password:
    file: ${TEKDOCS_SECRET_DIRECTORY:?Set TEKDOCS_SECRET_DIRECTORY}/postgres_runtime_password
  tekdocs_master_key:
    file: ${TEKDOCS_SECRET_DIRECTORY:?Set TEKDOCS_SECRET_DIRECTORY}/tekdocs_master_key
  publication_signing_key:
    file: ${TEKDOCS_SECRET_DIRECTORY:?Set TEKDOCS_SECRET_DIRECTORY}/publication_signing_key
