version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/Chicago }
    rebase-strategy: disabled
    groups:
      python-production: { dependency-type: production, update-types: [minor, patch] }
      python-development: { dependency-type: development, update-types: [minor, patch] }
    labels: [dependencies, backend]
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday, time: "09:10", timezone: America/Chicago }
    rebase-strategy: disabled
    groups:
      # These packages require exactly matching versions, including major updates.
      frontend-vitest:
        patterns: [vitest, "@vitest/coverage-v8"]
      frontend-react:
        patterns: [react, react-dom]
      frontend-production: { dependency-type: production, update-types: [minor, patch], exclude-patterns: [mermaid, react-router, lucide-react] }
      frontend-development: { dependency-type: development, update-types: [minor, patch], exclude-patterns: ["@playwright/test"] }
    # Playwright requires a matching, digest-pinned browser image and rehearsals.
    # Keep its proposal separate so it can be completed as a coordinated update.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    labels: [dependencies, frontend]
    open-pull-requests-limit: 10
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "09:20", timezone: America/Chicago }
    rebase-strategy: disabled
    ignore:
      # The supported backend toolchain remains Python 3.13.
      - dependency-name: python
        versions: [">=3.14"]
    labels: [dependencies, containers]
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly, day: monday, time: "09:25", timezone: America/Chicago }
    rebase-strategy: disabled
    # Node major upgrades require synchronized images and browser tooling.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    labels: [dependencies, containers]
  - package-ecosystem: npm
    directory: /renderer
    schedule: { interval: weekly, day: monday, time: "09:27", timezone: America/Chicago }
    rebase-strategy: disabled
    groups:
      renderer-production: { dependency-type: production, update-types: [minor, patch], exclude-patterns: ["@mermaid-js/mermaid-cli", puppeteer] }
    labels: [dependencies, renderer]
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /renderer
    schedule: { interval: weekly, day: monday, time: "09:28", timezone: America/Chicago }
    rebase-strategy: disabled
    # Node major upgrades require synchronized images and browser tooling.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    labels: [dependencies, containers]
  - package-ecosystem: docker
    directory: /mailpit
    schedule: { interval: weekly, day: monday, time: "09:29", timezone: America/Chicago }
    rebase-strategy: disabled
    # Node major upgrades require synchronized images and browser tooling.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    labels: [dependencies, containers]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "09:30", timezone: America/Chicago }
    rebase-strategy: disabled
    groups:
      github-actions: { patterns: ["*"] }
    labels: [dependencies, ci]
