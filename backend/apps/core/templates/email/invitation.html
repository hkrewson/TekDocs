<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invitation to {{ product_name }}</title>
  </head>
  <body style="margin:0;background:#f3f2ee;color:#23241f;font-family:Arial,sans-serif">
    <main style="max-width:600px;margin:0 auto;padding:32px 20px">
      <div style="background:#ffffff;border:1px solid #d8d5cd;padding:28px">
        <p style="margin:0 0 18px;font-size:16px;font-weight:700">{{ product_name }}</p>
        <h1 style="margin:0 0 14px;font-size:22px;line-height:1.3">You have been invited</h1>
        <p style="margin:0 0 22px;font-size:15px;line-height:1.6">Join {{ tenant_name }} in {{ product_name }}. This invitation expires {{ expires_at|date:"DATETIME_FORMAT" }}.</p>
        <p style="margin:0"><a href="{{ acceptance_url }}" style="display:inline-block;background:#315b4c;color:#ffffff;padding:11px 18px;text-decoration:none;font-weight:700">Accept invitation</a></p>
        <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#5b5d56">If you were not expecting this invitation, you can ignore this message.</p>
      </div>
    </main>
  </body>
</html>
