      - client_user
      type: string
      description: |-
        * `owner` - Owner
        * `administrator` - Administrator
        * `technician` - Technician
        * `contributor` - Contributor
        * `read_only` - Read-only
        * `client_administrator` - Client Administrator
        * `client_user` - Client User
